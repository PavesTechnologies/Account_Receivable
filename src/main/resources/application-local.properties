# ===============================
# LOCAL DEVELOPMENT ONLY - activate with SPRING_PROFILES_ACTIVE=local
# ===============================
# Echoes SQL and bound parameter values. Never enable in a shared or
# production environment: bound values include client and invoice data.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.AccountReceivableManagement=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Local frontend dev server (Vite).
ar.cors.allowed-origins=${AR_CORS_ALLOWED_ORIGINS:http://localhost:5173}
