# =====================================================================================================================
# "local-demo" profile - run the AR backend on a developer machine for API development and demos, ISOLATED from all
# shared infrastructure (shared Aiven AR database, shared PMS/RMS RDS CDC sources, TMS, XMS, UMS, real SMTP).
#
# Activate ONLY with:   SPRING_PROFILES_ACTIVE=local-demo   (never put it in .env, never combine it with another
# environment profile). See docs/local-demo.md for the exact start-up and seeding steps.
#
# Every property that references a shared environment variable in application.properties (DB_*, RMS_DB_*, PMS_DB_*,
# TMS_API_BASE_URL, JWT_ISSUER_URI, MAIL_*, XMS_*, AUTH_JWT_*) is overridden below with a local or inert value. This file
# deliberately reads ONLY AR_DEMO_* variables, because spring-dotenv loads .env into the environment in every profile.
# The isolation guard (com.AccountReceivableManagement.demo.LocalDemoIsolationValidator) refuses to start if the resolved
# values could still reach shared infrastructure, for example through an OS variable such as SPRING_DATASOURCE_URL.
# =====================================================================================================================

# --- Datasource: a dedicated LOCAL MySQL schema. AR_DEMO_DB_PASSWORD has no default on purpose (start fails if unset).
spring.datasource.url=${AR_DEMO_DB_URL:jdbc:mysql://127.0.0.1:3399/ar_demo?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${AR_DEMO_DB_USERNAME:ar_demo_app}
spring.datasource.password=${AR_DEMO_DB_PASSWORD}

# Hibernate creates the demo schema in the local database on first start. No SQL is logged (bind values can contain data).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.AccountReceivableManagement=INFO

# A classpath change must not restart the app (and re-run schema updates) behind your back.
spring.devtools.restart.enabled=false

server.port=${AR_DEMO_SERVER_PORT:8080}

# --- Everything that would consume or write shared infrastructure is OFF (all of these default to ON when absent) ---
ar.cdc.infrastructure.enabled=false
ar.cdc.inbox-processor.enabled=false
ar.billing.status-schedulers.enabled=false
client-cdc.enabled=false
project-cdc.enabled=false
project-cdc.milestone-initial-sync.enabled=false

# CDC source settings overridden with inert values so the shared RMS/PMS endpoints can never resolve.
client-cdc.hostname=
client-cdc.port=
client-cdc.database-name=
client-cdc.username=
client-cdc.password=
client-cdc.jdbc-url=
project-cdc.hostname=
project-cdc.port=
project-cdc.database-name=
project-cdc.username=
project-cdc.password=
project-cdc.jdbc-url=

# --- External services: none are reachable. Billing snapshots come from the seed script, not from TMS/XMS. ---
# NOTE: tms.api.base-url maps (relaxed binding) to the OS variable TMS_API_BASE_URL, which outranks this file. The early
# isolation guard therefore pins it to this same value; a test keeps the two in sync.
tms.api.base-url=http://127.0.0.1:9
xms.api.enabled=false
xms.api.base-url=

# --- Email: real delivery is impossible. DemoMailConfig replaces the SMTP sender with a log-only sender; these values
#     only keep EmailServiceImpl's required properties satisfied and are checked by the guard (loopback or blank). ---
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=demo@ar-demo.invalid
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# --- Authentication: demo-only HS256 tokens signed with a local secret (DemoJwtConfig). No shared issuer is contacted. ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
ar.demo.jwt.secret=${AR_DEMO_JWT_SECRET}

# Signature-management endpoints keep their own verification and still require the FINANCE_EXECUTIVE role; they simply
# trust the same local secret. A demo token without that role is rejected exactly as before.
app.security.jwt.algorithm=HS256
app.security.jwt.secret=${AR_DEMO_JWT_SECRET}
app.security.jwt.secret-encoding=UTF8
app.security.jwt.public-key-pem=
app.security.jwt.issuer=https://ar-demo.invalid/local
app.security.jwt.audience=
app.security.jwt.roles-claim=roles
app.security.jwt.required-role=FINANCE_EXECUTIVE

# --- Expense FX: same development values as the existing "local" profile (rates would come from the local
#     currency_exchange_rate table; none are seeded, so cross-currency expenses are simply not part of the demo). ---
ar.expense-fx.provider=database
ar.expense-fx.scale=2
ar.expense-fx.rounding-mode=HALF_UP
ar.expense-fx.rate-date-basis=EXPENSE_DATE
