# ===============================
# APPLICATION
# ===============================
spring.application.name=AccountsReceivableService
spring.task.scheduling.enabled=true
# Shared @Scheduled thread pool. Spring's default is one thread, on which a
# long automatic billing tick (TMS calls) would delay the CDC inbox and
# billing occurrence/configuration schedulers. Each task still never
# overlaps itself.
spring.task.scheduling.pool.size=${AR_SCHEDULING_POOL_SIZE:3}

# ===============================
# DATASOURCE (AR Database - Aiven)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Schema changes are applied by Hibernate (update) plus the reviewed scripts in
# db/migration - see AUTOMATIC_BILLING_RUNBOOK.md, Database migrations. Override
# per environment with SPRING_JPA_HIBERNATE_DDL_AUTO=validate once Flyway manages
# that environment's schema (below) and a validate start has passed in staging.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Flyway (G-27) - off until an environment is adopted. db/migration V1..V11 were
# applied by hand on top of a Hibernate-created schema (they have no baseline for
# the core tables), so an existing database must NEVER run them: adopt it by
# baselining at the highest version a DBA has verified as applied, e.g.
#   AR_FLYWAY_ENABLED=true AR_FLYWAY_BASELINE_ON_MIGRATE=true AR_FLYWAY_BASELINE_VERSION=11
# Flyway then records the baseline and applies only later scripts (V12+) before
# Hibernate starts. Baseline-on-migrate only acts on a schema without history.
spring.flyway.enabled=${AR_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${AR_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${AR_FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# SQL echo is for local development only (profile "local") - it would put every
# statement into production logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JACKSON
# ===============================
# Serialize LocalDate / LocalDateTime as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# SERVER
# ===============================
server.port=8080
server.servlet.context-path=/paves/ar

# CORS (G-25): comma-separated trusted frontend origins (scheme://host[:port]),
# e.g. https://enterpriseappdev.example.net. Empty = no cross-origin browser
# access (a frontend on the same origin needs none). Wildcards are refused.
ar.cors.allowed-origins=${AR_CORS_ALLOWED_ORIGINS:}

# Swagger / OpenAPI
# API documentation is off unless enabled per environment (AR_API_DOCS_ENABLED=true,
# e.g. development): when on, /v3/api-docs and /swagger-ui are public.
springdoc.api-docs.enabled=${AR_API_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${AR_API_DOCS_ENABLED:false}

# ===============================
# EXTERNAL SERVICES
# ===============================
tms.api.base-url=${TMS_API_BASE_URL}
# Bounded TMS calls: a TMS that never answers must not block a request or the
# automatic billing scheduler. A timeout is retried by automatic billing.
tms.api.connect-timeout=${TMS_API_CONNECT_TIMEOUT:PT10S}
tms.api.read-timeout=${TMS_API_READ_TIMEOUT:PT60S}
# Service-to-service credential for background/scheduled TMS access outside user sessions
tms.api.service-token=${TMS_SERVICE_TOKEN:}

# ===============================
# SECURITY (UMS JWT)
# Spring Boot builds the JwtDecoder from the issuer (same as RMS).
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# ===============================
# MAIL (Gmail SMTP - Invoice delivery)
# Credentials come from environment variables only - see .env.example.
# MAIL_USERNAME/MAIL_PASSWORD must never be committed.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# LOGGING
# ===============================
# Production-safe defaults. SQL statements and their bound values (client
# emails, amounts, invoice data) are never logged here; the "local" profile
# (application-local.properties) turns them on for development.
logging.level.root=INFO
logging.level.com.AccountReceivableManagement=${AR_LOG_LEVEL:INFO}
logging.level.io.debezium=INFO
logging.level.org.apache.kafka.connect=WARN
# Every line logged while an automatic billing run is processed carries its id
# ([run=...]), so one run can be followed through scheduler, orchestrator and
# billing services. Empty outside a run.
logging.pattern.level=%5p %replace([run=%X{billingRunId}]){'\\[run=\\]',''}

# ===============================
# ACTUATOR / HEALTH
# ===============================
# Only these endpoints are exposed; everything except health requires a JWT.
management.endpoints.web.exposure.include=health,info,metrics
# Kubernetes probes, unauthenticated, status only:
#   /paves/ar/actuator/health/liveness  - the application itself (restart if DOWN)
#   /paves/ar/actuator/health/readiness - application + AR database (traffic)
# TMS, UMS and SMTP are deliberately not part of either: an outage of theirs
# must not restart or drain AR. Their failures surface in metrics and runs.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.mail.enabled=false



# ===============================
# CLIENT CDC (RMS -> AR)
# ===============================

client-cdc.enabled=true




# Connector
client-cdc.connector-name=RMS
client-cdc.connector-class=io.debezium.connector.mysql.MySqlConnector

# Source Database (RMS RDS)
client-cdc.database-type=mysql
client-cdc.hostname=${RMS_DB_HOST}
client-cdc.port=${RMS_DB_PORT}
client-cdc.database-name=${RMS_DB_NAME}
client-cdc.username=${RMS_DB_USERNAME}
client-cdc.password=${RMS_DB_PASSWORD}

client-cdc.jdbc-url=jdbc:mysql://${RMS_DB_HOST}:${RMS_DB_PORT}/${RMS_DB_NAME}?connectionTimeZone=UTC

# Debezium
client-cdc.server-name=rms_mysql
client-cdc.server-id=85744
client-cdc.topic-prefix=client-cdc

# Monitor only the RMS database
client-cdc.database-include-list=rms

# Monitor only the client table
client-cdc.table-include-list=rms.client

# Snapshot
client-cdc.snapshot-mode=when_needed

# Storage
client-cdc.offset-table=debezium_client_offsets
client-cdc.schema-history-table=debezium_client_schema_history

# SSL
client-cdc.ssl.mode=REQUIRED

# ===============================
# PROJECT CDC (PMS -> AR)
# ===============================

project-cdc.enabled=true

# Connector
project-cdc.connector-name=PMS
project-cdc.connector-class=io.debezium.connector.mysql.MySqlConnector

# Source Database (PMS RDS - Shared Dev RDS)
project-cdc.database-type=mysql
project-cdc.hostname=${PMS_DB_HOST}
project-cdc.port=${PMS_DB_PORT}
project-cdc.database-name=${PMS_DB_NAME}
project-cdc.username=${PMS_DB_USERNAME}
project-cdc.password=${PMS_DB_PASSWORD}

project-cdc.jdbc-url=jdbc:mysql://${PMS_DB_HOST}:${PMS_DB_PORT}/${PMS_DB_NAME}?connectionTimeZone=UTC
# Debezium
project-cdc.server-name=pms_mysql
project-cdc.server-id=85745
project-cdc.topic-prefix=project-cdc

# Monitor only the PMS database
project-cdc.database-include-list=pms

# Monitor only the project table
project-cdc.table-include-list=pms.projects

# Snapshot
project-cdc.snapshot-mode=when_needed

# Storage
project-cdc.offset-table=debezium_project_offsets
project-cdc.schema-history-table=debezium_project_schema_history

# SSL
project-cdc.ssl.mode=REQUIRED

# ===============================
# AUTOMATIC BILLING
# ===============================
# Off by default. When on, every tick hands at most batch-size due billing
# events (occurrences of approved AUTOMATIC configurations, T&M periods) to
# AutomaticBillingOrchestrator, which stops at PENDING_APPROVAL.
ar.automatic-billing.enabled=${AR_AUTOMATIC_BILLING_ENABLED:false}
# Spring 6-field cron (second minute hour day month weekday).
ar.automatic-billing.cron=${AR_AUTOMATIC_BILLING_CRON:0 */5 * * * *}
ar.automatic-billing.batch-size=${AR_AUTOMATIC_BILLING_BATCH_SIZE:50}
# How long one worker owns a run before another may take a stalled run over.
ar.automatic-billing.claim-duration=${AR_AUTOMATIC_BILLING_CLAIM_DURATION:PT15M}
# Retry of runs that failed for a temporary reason (TMS 5xx/unreachable,
# database connectivity or lock timeouts), and recovery of interrupted runs
# (claim expired: the worker stopped renewing it). Validation and data
# failures are never retried automatically. At most max-attempts attempts in
# total; the n-th retry waits initial-delay * multiplier^(n-1), capped at
# max-delay. Runs left FAILED without a next retry need manual intervention:
# re-queue them with POST /api/v1/recovery/automatic-billing-runs/{id}/requeue
# (OPERATIONS_RECOVERY). With retry disabled nothing is attempted again on its
# own: an interrupted run is closed as FAILED (not left PROCESSING), and only
# explicitly re-queued runs (operator or configuration re-approval) are run.
# PENDING_APPROVAL runs whose invoice is already approved are completed every
# tick whatever this setting (it records Finance's decision, it is not a retry).
ar.automatic-billing.retry.enabled=${AR_AUTOMATIC_BILLING_RETRY_ENABLED:true}
ar.automatic-billing.retry.max-attempts=${AR_AUTOMATIC_BILLING_RETRY_MAX_ATTEMPTS:3}
ar.automatic-billing.retry.initial-delay=${AR_AUTOMATIC_BILLING_RETRY_INITIAL_DELAY:PT15M}
ar.automatic-billing.retry.multiplier=${AR_AUTOMATIC_BILLING_RETRY_MULTIPLIER:2.0}
ar.automatic-billing.retry.max-delay=${AR_AUTOMATIC_BILLING_RETRY_MAX_DELAY:PT6H}
# Backfill: billing events whose billing date passed unprocessed (downtime,
# disabled scheduler) are picked up oldest first. When disabled, only events
# due today are picked up. max-age-days > 0 leaves older events to the manual
# flow; 0 = no limit.
ar.automatic-billing.backfill.enabled=${AR_AUTOMATIC_BILLING_BACKFILL_ENABLED:true}
ar.automatic-billing.backfill.max-age-days=${AR_AUTOMATIC_BILLING_BACKFILL_MAX_AGE_DAYS:0}

# ===============================
# INVOICE DELIVERY AND RECEIVABLE RECONCILIATION
# ===============================
# A PENDING delivery older than this is no longer in flight: its outcome is
# unknown and an operator may resolve it (POST /api/v1/recovery/
# invoice-deliveries/{id}/resolve). Must exceed the SMTP timeouts together.
ar.invoice-delivery.pending-timeout=${AR_INVOICE_DELIVERY_PENDING_TIMEOUT:PT10M}
# Creates the missing receivable of every invoice with a SENT delivery (the
# step that normally follows a send). Never sends email.
ar.receivable-reconciliation.enabled=${AR_RECEIVABLE_RECONCILIATION_ENABLED:true}
ar.receivable-reconciliation.cron=${AR_RECEIVABLE_RECONCILIATION_CRON:0 */15 * * * *}
ar.receivable-reconciliation.batch-size=${AR_RECEIVABLE_RECONCILIATION_BATCH_SIZE:50}

# ===============================
# OPERATIONS MONITORING AND RECONCILIATION
# ===============================
# Read-only reports at /api/v1/operations/** (billing-summary, reconciliation,
# alerts). See OPERATIONS_MONITORING_AND_RECONCILIATION.md.
# Comma-separated JWT authorities (ROLE_<role> or a permission) allowed to read
# them. Empty = nobody - the reports carry client and financial data.
ar.operations.report-authorities=${AR_OPERATIONS_REPORT_AUTHORITIES:}
# Days past its billing date after which a due automatic occurrence without a
# run counts as overdue (reporting cut-off, not an SLA).
ar.operations.overdue-grace-days=${AR_OPERATIONS_OVERDUE_GRACE_DAYS:1}
ar.operations.reconciliation.max-findings-per-check=${AR_OPERATIONS_RECONCILIATION_MAX_FINDINGS:100}
# Threshold alerts: off by default. A condition is evaluated only once its
# threshold is set (raise when value > threshold); thresholds are to be agreed
# with Finance - none is assumed. Raised alerts are logged as
# [OperationsAlert] (WARN) and counted in ar.operations.alerts{condition}.
ar.operations.alerts.enabled=${AR_OPERATIONS_ALERTS_ENABLED:false}
ar.operations.alerts.cron=${AR_OPERATIONS_ALERTS_CRON:0 0 * * * *}
ar.operations.alerts.thresholds.RUNS_NEEDING_INTERVENTION=${AR_ALERT_RUNS_NEEDING_INTERVENTION:}
ar.operations.alerts.thresholds.RUNS_STUCK=${AR_ALERT_RUNS_STUCK:}
ar.operations.alerts.thresholds.RUNS_RETRY_SCHEDULED=${AR_ALERT_RUNS_RETRY_SCHEDULED:}
ar.operations.alerts.thresholds.OCCURRENCES_OVERDUE=${AR_ALERT_OCCURRENCES_OVERDUE:}
ar.operations.alerts.thresholds.INVOICES_PENDING_APPROVAL=${AR_ALERT_INVOICES_PENDING_APPROVAL:}
ar.operations.alerts.thresholds.DOCUMENTS_MISSING=${AR_ALERT_DOCUMENTS_MISSING:}
ar.operations.alerts.thresholds.DELIVERIES_FAILED=${AR_ALERT_DELIVERIES_FAILED:}
ar.operations.alerts.thresholds.SENT_WITHOUT_RECEIVABLE=${AR_ALERT_SENT_WITHOUT_RECEIVABLE:}
ar.operations.alerts.thresholds.RECONCILIATION_EXCEPTIONS=${AR_ALERT_RECONCILIATION_EXCEPTIONS:}

# ===============================
# FINANCIAL AUTHORIZATION (UMS JWT authorities)
# ===============================
# Who may take financial decisions. Comma-separated JWT authorities:
# ROLE_<UMS role> (from the "roles" claim) or a permission (from the
# "permissions" claim). The UMS role/permission names are not defined in this
# repository: none is assumed, and an EMPTY list grants NOBODY - set these per
# environment before Finance can approve or send.
ar.security.authorization.configuration-approval-authorities=${AR_AUTH_CONFIGURATION_APPROVAL:}
ar.security.authorization.invoice-approval-authorities=${AR_AUTH_INVOICE_APPROVAL:}
ar.security.authorization.invoice-delivery-authorities=${AR_AUTH_INVOICE_DELIVERY:}
# Operational recovery (re-queue a failed run, reconcile a run with its approved
# invoice, create a sent invoice's missing receivable, resolve an uncertain
# delivery) - see AUTOMATIC_BILLING_RUNBOOK.md.
ar.security.authorization.operations-recovery-authorities=${AR_AUTH_OPERATIONS_RECOVERY:}
# Maker-checker: the user who submitted a configuration or invoice cannot approve it.
ar.security.authorization.maker-checker=${AR_AUTH_MAKER_CHECKER:true}
# Accepted JWT "aud" values; empty = audience not validated (no UMS audience
# contract documented yet). Issuer, signature, expiry and user_id are always checked.
ar.security.jwt.audiences=${AR_JWT_AUDIENCES:}
