# ===============================
# APPLICATION
# ===============================
spring.application.name=AccountsReceivableService

# ===============================
# DATASOURCE (Aiven MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://accounts-receivable-db-accounts-receivable.f.aivencloud.com:17433/accounts_receivable?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
