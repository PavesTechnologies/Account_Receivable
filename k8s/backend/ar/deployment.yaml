apiVersion: apps/v1
kind: Deployment
metadata:
  name: ar-deployment
  namespace: backend
  labels:
    app: ar
    team: paves
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ar
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ar
    spec:
      serviceAccountName: paves-service-account
      containers:
        - name: ar
          image: 743737183908.dkr.ecr.ap-south-1.amazonaws.com/paves/ar-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ar-secrets
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/paves/ar"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Actuator probe groups (unauthenticated, status only). Liveness covers the
          # application itself; readiness adds the AR database. TMS/UMS/SMTP
          # outages deliberately affect neither. The previous path /paves/ar/health
          # requires a JWT (401) and would fail both probes.
          # NOTE: ArgoCD deploys from intranet-devops k8s/backend/ar - mirror this there.
          livenessProbe:
            httpGet:
              path: /paves/ar/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /paves/ar/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
